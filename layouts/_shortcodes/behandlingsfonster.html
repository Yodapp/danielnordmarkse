    <text x="278" y="159" font-size="15" fill="#444">Stroken börjar — flimmer, synbortfall, yrsel, explosiv huvudvärk.</text>

    <text x="278" y="182" font-size="19" font-weight="700" fill="#1a1a1a">13:43</text>

    <text x="278" y="239" font-size="19" font-weight="700" fill="#1a1a1a">14:15</text>
    <text x="278" y="262" font-size="15" fill="#444">Ambulansen undersöker. Triage <tspan font-weight="700" fill="#c68a00">GUL</tspan>. Normala pupiller.</text>

    <text x="278" y="293" font-size="19" font-weight="700" fill="#1a1a1a">14:43</text>

    <text x="278" y="337" font-size="15" fill="#444">Ambulansuppdraget avslutas — vården lämnar över.</text>

    <text x="278" y="368" font-size="19" font-weight="700" fill="#1a1a1a">15:06</text>

    <text x="278" y="470" font-size="15" font-style="italic" fill="#8a8a8a">Timmarna går. Ingen strokebedömning. Ingen bilddiagnostik.</text>
    <text x="278" y="492" font-size="15" font-style="italic" fill="#8a8a8a">Proppen sitter kvar och blockerar blodflödet.</text>
