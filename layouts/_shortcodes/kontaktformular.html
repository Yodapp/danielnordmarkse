{{ $endpoint := .Site.Params.formspree.endpoint }}
{{ if $endpoint }}
<form action="https://formspree.io/f/{{ $endpoint }}" method="POST" accept-charset="UTF-8" class="dn-contact-form not-prose grid gap-4 max-w-lg" aria-label="Kontaktformulär">
  <div>
    <label for="name" class="block mb-1 font-medium">Namn</label>
    <input type="text" name="name" id="name" autocomplete="name" required
      class="w-full rounded-md border border-neutral-300 px-3 py-2 dark:border-neutral-700 dark:bg-neutral-900">
  </div>
  <div>
    <label for="email" class="block mb-1 font-medium">E-post</label>
    <input type="email" name="email" id="email" autocomplete="email" inputmode="email" autocapitalize="none" required
      class="w-full rounded-md border border-neutral-300 px-3 py-2 dark:border-neutral-700 dark:bg-neutral-900">
  </div>
  <div>
    <label for="message" class="block mb-1 font-medium">Meddelande</label>
    <textarea name="message" id="message" rows="6" required
      class="w-full rounded-md border border-neutral-300 px-3 py-2 dark:border-neutral-700 dark:bg-neutral-900"></textarea>
  </div>
  <button type="submit"
    class="inline-block w-fit rounded-md bg-primary-600 px-4 py-2 text-neutral hover:bg-primary-500 dark:bg-primary-800 dark:hover:bg-primary-700">
    Skicka
  </button>
</form>
{{ else }}
<p><em>Kontaktformuläret är inte konfigurerat ännu. Lägg till din Formspree-endpoint i <code>config/_default/params.toml</code> under <code>[formspree]</code>.</em></p>
{{ end }}
