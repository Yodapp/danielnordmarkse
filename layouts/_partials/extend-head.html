{{/* Keep the chapter contents compact on phones while retaining the desktop sidebar. */}}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var desktopContents = window.matchMedia("(min-width: 1024px)");
    var syncContents = function () {
      document.querySelectorAll(".dn-toc").forEach(function (contents) {
        contents.open = desktopContents.matches;
      });
    };

    syncContents();
    if (desktopContents.addEventListener) {
      desktopContents.addEventListener("change", syncContents);
    } else {
      desktopContents.addListener(syncContents);
    }
  });
</script>
